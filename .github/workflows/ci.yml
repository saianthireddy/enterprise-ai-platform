name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend ai tests scripts

      - name: Test
        env:
          PYTHONPATH: .:backend
        run: pytest tests/ -v

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Production build
        working-directory: frontend
        run: npm run build

  docker:
    name: docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t enterprise-ai-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t enterprise-ai-frontend:ci .
